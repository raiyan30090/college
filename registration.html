<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./registration.css">
</head>
<body>
    <p class="para">Welcome to Haji Abul Hossain Institute Of Technoligy</p>

    <fieldset class="field">
        <h1 class="head" >Haji Abul Hossain Institute Of Technology</h1>
        <h2 class="tittle">"আপনার অ্যাকাউন্টটি লগইন / রেজিস্ট্রেশন করুন"</h2>
<br><br>
        <form class="form">
            <div class="text">
        <label  for="text">Student Name : </label>
        <input class="name" type="text" name="form" placeholder="Enter Your Name" required><br><br>

        <label for="text">Student Email : </label>
        <input class="name" type="email" name="form" placeholder="Enter Your email" required><br><br>

        <label for="text">Phone Number : </label>
        <input class="name" type="number" name="form" placeholder="Enter your Contact Number" required><br><br>

<label for="text">NID / Birthday Certificate : </label>
<input class="name" type="file" name="form" ><br><br>
<label for="text"> New Password : </label>
<input class="name" type="password" name="form" placeholder="Enter Your Password" required><br><br>

<button class="submit" type="submit">Submit</button><br><br>
<button class="reset" type="reset">Reset</button>
    </form>
    </div>
    </fieldset>

    
    
</body>
</html>
